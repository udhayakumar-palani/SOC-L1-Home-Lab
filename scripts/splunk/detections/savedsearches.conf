# SOC L1 home lab - detections
# Installed into $SPLUNK_HOME/etc/apps/soc_lab/default/savedsearches.conf
# Each stanza is mapped to a MITRE ATT&CK technique, matching the "Detections" box
# in the architecture diagram. All run on a schedule and show up under
# Activity > Triggered Alerts in Splunk Web - that firing is step 2 ("Detect") of
# the 9-step alert lifecycle; steps 3-9 (triage -> tune) are the L1 analyst's job.

[T1110 - Windows Repeated Failed Logons]
search = index=main sourcetype="WinEventLog:Security" EventCode=4625 \
| bin _time span=5m \
| stats count by _time, Account_Name, Source_Network_Address \
| where count >= 5 \
| eval mitre_technique="T1110 - Brute Force"
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 4
alert.track = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now

[T1110 - SSH Repeated Failed Logons (Ubuntu)]
search = index=main (sourcetype="linux_secure" OR sourcetype="syslog") "Failed password" \
| rex field=_raw "Failed password for (invalid user )?(?<ssh_user>\S+) from (?<src_ip>\d+\.\d+\.\d+\.\d+)" \
| bin _time span=5m \
| stats count by _time, ssh_user, src_ip \
| where count >= 5 \
| eval mitre_technique="T1110 - Brute Force (SSH)"
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 4
alert.track = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now

[T1136.001 - New Local User Account Created]
search = index=main sourcetype="WinEventLog:Security" EventCode=4720 \
| table _time, Account_Name, Caller_User_Name, Computer \
| eval mitre_technique="T1136.001 - Create Account: Local Account"
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 3
alert.track = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now

[T1098 - Account Added to Local Administrators]
search = index=main sourcetype="WinEventLog:Security" EventCode=4732 Group_Name="Administrators" \
| table _time, Member_Name, Group_Name, Caller_User_Name, Computer \
| eval mitre_technique="T1098 / T1136.001 - Privileged Group Membership Change"
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 4
alert.track = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now

[T1059.001 - Suspicious PowerShell Command]
search = index=main sourcetype="WinEventLog:Microsoft-Windows-PowerShell/Operational" EventCode=4104 \
(Message="*-enc*" OR Message="*-EncodedCommand*" OR Message="*FromBase64String*" OR Message="*IEX*" OR Message="*DownloadString*" OR Message="*Invoke-Expression*") \
| table _time, Computer, User, Message \
| eval mitre_technique="T1059.001 - Command and Scripting Interpreter: PowerShell"
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 4
alert.track = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now

[T1046 - Suricata Scan/Recon Alert]
search = index=main sourcetype="suricata" event_type=alert \
(alert.signature="*SCAN*" OR alert.signature="*Nmap*" OR alert.category="Attempted Information Leak" OR alert.category="Potentially Bad Traffic") \
| stats count by src_ip, dest_ip, alert.signature, alert.category, alert.severity \
| eval mitre_technique="T1046 - Network Service Discovery"
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 3
alert.track = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now

[Suricata High/Critical Severity Alert]
search = index=main sourcetype="suricata" event_type=alert alert.severity<=2 \
| table _time, src_ip, dest_ip, alert.signature, alert.category, alert.severity
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 5
alert.track = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now

[Threat Intel Lookup Match]
search = index=main (sourcetype="WinEventLog:Security" EventCode=4625) OR (sourcetype="suricata" event_type=alert) \
| eval src_ip=coalesce(src_ip, Source_Network_Address) \
| lookup threat_intel.csv ip AS src_ip OUTPUT category, confidence \
| where isnotnull(category) \
| table _time, src_ip, category, confidence, sourcetype
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 4
alert.track = 1
dispatch.earliest_time = -10m
dispatch.latest_time = now
